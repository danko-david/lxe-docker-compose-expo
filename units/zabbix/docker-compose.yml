services:
  zabbix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ChangeThisSecurePassword123!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    restart: unless-stopped
    ports:
      - "10051"
    volumes:
      - ./data/zabbix-server-scripts:/usr/lib/zabbix/alertscripts
      - ./data/zabbix-server-external:/usr/lib/zabbix/externalscripts
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ChangeThisSecurePassword123!
      ZBX_JAVAGATEWAY: zabbix-java-gateway
    depends_on:
      zabbix-db:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    restart: unless-stopped
    ports:
      - "8080"
      - "8443"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ChangeThisSecurePassword123!
      PHP_TZ: UTC
    depends_on:
      zabbix-db:
        condition: service_healthy
